doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            aenderungs_label: App\DBAL\Types\AenderungsLabelEnumType
            kalender_kategorie: App\DBAL\Types\KalenderKategorieEnumType
    orm:
        validate_xml_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
