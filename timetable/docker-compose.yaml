version: '3.8'

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pbd2h24asc_stundenplan_db
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: '!ChangeMe!'
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data:rw
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symfony -d pbd2h24asc_stundenplan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
