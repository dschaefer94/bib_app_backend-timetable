version: '3.8'

services:
  php:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://symfony:!ChangeMe!@database:5432/pbd2h24asc_stundenplan_db?serverVersion=16&charset=utf8"

  worker:
    build: .
    command: php bin/console messenger:consume scheduler_main --repeat
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    restart: always
    environment:
      DATABASE_URL: "postgresql://symfony:!ChangeMe!@database:5432/pbd2h24asc_stundenplan_db?serverVersion=16&charset=utf8"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pbd2h24asc_stundenplan_db
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: '!ChangeMe!'
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data:rw
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev # Startet Keycloak im Entwicklermodus
    environment:
      KEYCLOAK_ADMIN: admin # Standard Admin-Benutzername
      KEYCLOAK_ADMIN_PASSWORD: admin # Standard Admin-Passwort
      KC_DB: postgres
      # Use the existing Postgres database and user created for the app
      # Keycloak expects a DB; point it to the already provisioned DB and credentials
      KC_DB_URL: jdbc:postgresql://database:5432/pbd2h24asc_stundenplan_db # use existing DB
      KC_DB_USERNAME: symfony # reuse existing DB user
      KC_DB_PASSWORD: '!ChangeMe!' # reuse existing DB password
      KC_HOSTNAME: localhost # Wichtig für die korrekte Generierung von URLs in Keycloak
      KC_HTTP_PORT: 8080 # Keycloak lauscht intern auf Port 8080
    ports:
      - "8080:8080" # Mappt den internen Port 8080 auf den Host-Port 8080
    depends_on:
      database:
        condition: service_healthy # Keycloak startet erst, wenn die Datenbank bereit ist
    volumes:
      - keycloak_data:/opt/keycloak/data # Persistente Daten für Keycloak

volumes:
  db_data:
  keycloak_data: # Neues Volume für Keycloak-Daten
